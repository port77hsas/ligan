<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="لجان الاختبار">
<meta name="theme-color" content="#0e5a57">
<title>لجان الاختبار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* التخطيط: شريط علوي ثابت + لوحة رئيسية بالبطاقات، ونماذج إدخال بصفحات مستقلة، وتقارير بأوراق A4 */
:root{
  --teal:#0e5a57; --teal-2:#137a75; --teal-soft:#e3efee;
  --sand:#b8892f; --sand-soft:#f6eedc;
  --bg:#f3f6f5; --surface:#ffffff; --line:#d5e0de; --ink:#16302e; --muted:#5b7270;
  --danger:#b23a3a; --ok:#2f7d4f;
  --f-ui:"IBM Plex Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
  --f-display:"Reem Kufi", "IBM Plex Sans Arabic", "Geeza Pro", sans-serif;
  --r:14px;
  --rp:#0e5a57; --ra:#b8892f; --fz:1; --rf:"IBM Plex Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --teal:#4fb3ac; --teal-2:#6cc7c0; --teal-soft:#183a38; --sand:#d9ae5a; --sand-soft:#3a3122;
    --bg:#0f1918; --surface:#162523; --line:#2a3f3d; --ink:#e4efed; --muted:#9db5b2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --teal:#4fb3ac; --teal-2:#6cc7c0; --teal-soft:#183a38; --sand:#d9ae5a; --sand-soft:#3a3122;
  --bg:#0f1918; --surface:#162523; --line:#2a3f3d; --ink:#e4efed; --muted:#9db5b2; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;
  -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
[hidden]{display:none!important}

/* شريط علوي */
.topbar{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}
:root[data-theme="dark"] .topbar{color:#062321}
.topbar h1{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .back{background:rgba(255,255,255,.16);border:0;color:inherit;border-radius:10px;padding:8px 14px;min-height:44px;font-weight:600}
.saved{font-size:13px;opacity:.85}

main{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}

/* الرئيسية */
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.hero .school{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0;text-wrap:balance}
.hero .sub{color:var(--muted);margin:2px 0 0}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 16px;text-align:center;min-width:96px}
.stat b{display:block;font-size:22px;color:var(--teal);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

.section-title{font-size:14px;letter-spacing:.02em;color:var(--muted);font-weight:600;margin:28px 0 10px;display:flex;align-items:center;gap:10px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}

.entry-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.entry{position:relative;display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--teal);color:#fff;border:0;border-radius:18px;padding:22px 22px 18px;min-height:170px;overflow:hidden}
:root[data-theme="dark"] .entry{color:#062321}
.entry:nth-child(2){background:var(--teal-2)}
.entry:nth-child(3){background:var(--sand)}
.entry .cols{font-size:12px;font-weight:600;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px;align-self:flex-start;direction:ltr}
.entry h2{margin:6px 0 0;font-family:var(--f-display);font-size:26px}
.entry p{margin:0;opacity:.9;font-size:14px}
.entry .count{margin-top:auto;font-size:14px;font-weight:600}
.entry svg{position:absolute;left:16px;top:16px;width:44px;height:44px;opacity:.35}

.report-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.rep{display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:104px}
.rep:hover{border-color:var(--teal)}
.rep .no{font-size:12px;color:var(--sand);font-weight:700}
.rep b{font-size:16px}
.rep span{font-size:13px;color:var(--muted)}
.rep .orient{margin-top:auto;font-size:12px;color:var(--teal)}

.tools{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#062321}
.btn.sand{background:var(--sand);border-color:var(--sand);color:#fff}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.small{min-height:36px;padding:4px 12px;font-size:14px;border-radius:10px}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}

/* النماذج */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel + .panel{margin-top:16px}
.panel h3{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
.panel h3 .col{font-size:12px;color:var(--sand);background:var(--sand-soft);border-radius:999px;padding:1px 10px;direction:ltr}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld label .col{font-weight:500;color:var(--sand);direction:ltr;display:inline-block;margin-inline-start:4px}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:8px 12px;font-size:16px}
.fld textarea{min-height:120px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;min-height:20px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);border-radius:999px;padding:4px 6px 4px 12px;font-size:15px}
.chip button{border:0;background:transparent;width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:18px;line-height:1}
.addrow{display:flex;flex-direction:row!important;gap:8px}
.addrow input{flex:1;min-width:0}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1;min-width:200px}
.toolbar .search input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 14px}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table.data{width:100%;border-collapse:collapse;font-size:15px}
table.data th{background:var(--teal-soft);text-align:start;font-weight:600;padding:10px 12px;font-size:13px;white-space:nowrap;position:sticky;top:0}
table.data td{padding:8px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
table.data td.acts{text-align:end;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;min-height:40px;margin-inline-start:4px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

.dist-group{margin-bottom:18px}
.dist-group h4{margin:0 0 8px;font-size:15px;display:flex;gap:10px;align-items:center}
.dist-group h4 .pill{background:var(--sand-soft);color:var(--sand);border-radius:999px;padding:1px 10px;font-size:13px}
.dist-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dcard .subj{font-weight:700;font-size:16px}
.dcard .meta{font-size:13px;color:var(--muted)}
.dcard .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.dcard .kv span:nth-child(odd){color:var(--muted)}
.dcard .acts{display:flex;gap:6px;justify-content:flex-end}

/* نافذة */
.modal-back{position:fixed;inset:0;background:rgba(10,30,28,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 0}
.modal{background:var(--surface);width:min(860px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal-back{align-items:center}.modal{border-radius:20px}}
.modal h3{margin:0 0 12px;font-size:20px}
.modal .group-title{font-size:13px;font-weight:700;color:var(--sand);margin:16px 0 8px;display:flex;gap:8px;align-items:center}
.modal .group-title::after{content:"";flex:1;height:1px;background:var(--line)}
.modal .foot{display:flex;gap:10px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;font-weight:600;max-width:90vw}

/* التقارير */
.rep-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.rep-bar .fld{flex-direction:row;align-items:center;gap:8px}
.rep-bar select{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 12px}
.paper-wrap{overflow-x:auto;padding-bottom:10px}
.sheet{background:#fff;color:#111;margin:0 auto 18px;box-shadow:0 2px 14px rgba(0,0,0,.12);width:210mm;height:297mm;padding:9mm 10mm;position:relative;overflow:hidden;
  font-family:var(--rf);font-size:calc(12px*var(--fz));line-height:1.45;display:flex;flex-direction:column}
.sheet.land{width:297mm;height:210mm}
.sheet *{color:inherit}
.p-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border:1.5px solid var(--rp);border-radius:10px;padding:6px 14px;margin-bottom:8px;background:#fff;width:100%;box-sizing:border-box}
.wm{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.wm-band{position:absolute;left:0;right:0;height:3.2mm;background-repeat:repeat-x;background-size:auto 100%;opacity:.55}
.wm-band.top{top:0}.wm-band.bot{bottom:0;transform:scaleY(-1)}
.wm-c{position:absolute;left:50%;top:52%;width:62%;max-height:70%;object-fit:contain;transform:translate(-50%,-50%);opacity:.05}
.sheet.land .wm-c{width:42%}
.wm-c.custom{opacity:.08;max-height:80%}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;min-height:40px;font-size:14px}
.swatch i{width:16px;height:16px;border-radius:50%;display:inline-block}
.swatch span{margin-inline-start:4px}
.rs-prev{margin-top:14px;background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:var(--rf);font-size:calc(13px*var(--fz));max-width:560px}
.rs-prev .t{background:var(--rp);color:#fff;text-align:center;border-radius:8px;padding:4px;font-weight:700;margin-bottom:8px;font-size:calc(16px*var(--fz))}
.rs-prev table{width:100%;border-collapse:collapse}
.rs-prev th{background:var(--rp);color:#fff;padding:4px;border:1px solid var(--rp)}
.rs-prev th:last-child{background:var(--ra);border-color:var(--ra)}
.rs-prev td{border:1px solid #9bb3b0;padding:4px;text-align:center}
.rs-prev tr:nth-child(3) td{background:color-mix(in srgb,var(--rp) 9%,transparent)}
.wm-pick{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wm-thumb{width:120px;height:120px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:calc(13px*var(--fz));overflow:hidden;flex:none}
.wm-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.wm-h{position:absolute;left:5mm;bottom:5mm;width:44mm;opacity:.11}
.sheet.land .wm-h{width:52mm}
.cover .wm{z-index:0}.cover .wm-h{opacity:.18;width:60mm}
.sheet-in{position:relative;z-index:1;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;transform-origin:top right}
.p-head .r{text-align:center;font-weight:700;font-size:calc(12.5px*var(--fz));line-height:1.5}
.p-head .l{text-align:center;font-weight:700;font-size:calc(12.5px*var(--fz));color:var(--rp);line-height:1.5}
.p-head .c{text-align:center}
.p-head .c img{max-height:56px;max-width:140px}
.emblem{font-family:var(--f-display);color:var(--rp);font-size:calc(17px*var(--fz));line-height:1.1}
.emblem small{display:block;font-family:var(--f-ui);font-size:calc(9px*var(--fz));letter-spacing:.06em;color:var(--rp)}
.p-title{background:var(--rp);color:#fff!important;text-align:center;font-family:var(--rf);font-weight:700;font-size:calc(19px*var(--fz));border-radius:9px;padding:5px 10px;margin:2px 0 8px}
.p-meta{display:flex;justify-content:space-between;gap:12px;font-weight:700;margin-bottom:6px;font-size:calc(13px*var(--fz))}
.p-meta .v{color:#a1262a;font-weight:700}
table.pt{width:100%;border-collapse:collapse;table-layout:fixed}
table.pt th{background:var(--rp);color:#fff!important;font-weight:700;padding:4px 3px;border:1px solid var(--rp);font-size:calc(11.5px*var(--fz))}
table.pt td{border:1px solid #9bb3b0;padding:3px 4px;text-align:center;font-size:calc(11.5px*var(--fz));vertical-align:middle;overflow-wrap:anywhere}
table.pt tr:nth-child(even) td{background:color-mix(in srgb,var(--rp) 9%,transparent)}
table.pt td.name{text-align:right;font-weight:600}
table.pt.dense td{padding:1px 3px;font-size:calc(10.5px*var(--fz));line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-foot{margin-top:auto;display:flex;justify-content:space-between;gap:20px;border-top:1.5px solid var(--rp);padding-top:6px;font-weight:700;font-size:calc(13px*var(--fz))}
.p-foot .who{color:var(--rp)}
.sign-lines{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-weight:600}

/* غلاف اللجنة */
.cover{padding:0;background:linear-gradient(160deg,#fff 0 55%,color-mix(in srgb,var(--rp) 8%,#fff) 55% 100%)}
.cover .frame{position:absolute;inset:8mm;border:2px solid var(--rp);border-radius:16px}
.cover .frame::before{content:"";position:absolute;inset:4px;border:1px solid var(--ra);border-radius:12px}
.cover .band{position:absolute;top:0;left:0;width:70mm;height:70mm;background:var(--rp);clip-path:polygon(0 0,100% 0,0 100%)}
.cover .band2{position:absolute;bottom:0;right:0;width:90mm;height:60mm;background:var(--rp);opacity:.12;clip-path:polygon(100% 0,100% 100%,0 100%)}
.cover .inner{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:14mm 16mm 22mm;text-align:center;gap:8mm}
.cover .logo img{max-height:80px;max-width:200px}
.cover .logo .emblem{font-size:calc(30px*var(--fz))}
.cover .logo .emblem small{font-size:calc(12px*var(--fz))}
.cover .dir{font-weight:700;font-size:calc(17px*var(--fz))}
.cover .sch{font-family:var(--f-display);font-size:calc(26px*var(--fz));color:var(--rp)}
.cover .big{background:var(--rp);border-radius:22px;padding:24mm 14mm;margin:4mm 0;width:100%;box-shadow:inset 0 0 0 3px var(--ra), inset 0 0 0 7px var(--rp), inset 0 0 0 8px var(--ra)}
.cover .big div{font-family:var(--f-display);color:#f3dfae!important;font-size:calc(78px*var(--fz));line-height:1.15}
.cover .info{width:100%;border:1.5px solid var(--rp);border-radius:14px;padding:5mm 8mm;display:flex;flex-direction:column;gap:4mm;background:#fff}
.cover .info .row{display:grid;grid-template-columns:36mm 1fr;align-items:center;gap:4mm;font-size:calc(21px*var(--fz));font-weight:700}
.cover .info .row span:first-child{text-align:right;color:var(--rp)}
.cover .info .row span:last-child{border:1.5px solid #333;border-radius:6px;padding:2mm;color:#a1262a}
.cover .sig{margin-top:auto;width:100%;display:flex;justify-content:space-around;font-weight:700;font-size:calc(18px*var(--fz))}
.cover .sig div span{display:block;color:var(--rp);font-size:calc(13px*var(--fz))}

/* بطاقات الجلوس */
.cards{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);gap:4mm;flex:1;min-height:0}
.scard{border:1.6px solid #222;border-radius:4px;padding:4mm 5mm;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:calc(12.5px*var(--fz));position:relative}
.scard .hdr{border-bottom:1px solid var(--rp);padding-bottom:2mm;font-size:calc(11.5px*var(--fz))}
.scard .nm{font-size:calc(14px*var(--fz))}
.scard .row{display:flex;justify-content:space-between;gap:6px}
.scard .seat{position:absolute;left:4mm;top:12mm;text-align:center;border:1.5px solid var(--rp);border-radius:8px;padding:1mm 3mm;color:var(--rp)}
.scard .seat b{display:block;font-size:calc(24px*var(--fz));line-height:1.1}
.scard .seat small{font-size:calc(9px*var(--fz))}

/* سير ورقة الإجابة */
table.flow{width:100%;border-collapse:collapse;table-layout:fixed;flex:none}
table.flow .grp th{border:0;padding:0 0 2.5mm;vertical-align:bottom}
table.flow .grp th div{border:1.5px solid #6f8794;border-radius:9px;background:#e9f0f3;margin:0 .8mm;padding:2.6mm 1mm;font-weight:800;font-size:calc(13.5px*var(--fz));color:#1d2b33}
table.flow .grp th div.per{font-size:calc(16px*var(--fz))}
table.flow .grp th div.sm{font-size:calc(11px*var(--fz));padding:1.4mm .5mm;line-height:1.3}
table.flow .hd th{border:1.5px solid #8696a0;background:#fff;color:#111;font-weight:800;font-size:calc(11.5px*var(--fz));padding:2mm 1mm;line-height:1.35}
table.flow td{border:1.5px solid #8696a0;text-align:center;vertical-align:middle;position:relative;padding:1mm;font-size:calc(11.5px*var(--fz))}
table.flow td.shade{background:rgba(226,234,238,.6)}
table.flow td.b{font-weight:800;font-size:calc(13px*var(--fz))}
table.flow td.obs{font-weight:700;font-size:calc(11px*var(--fz));line-height:1.5}
td.top{vertical-align:top!important;padding-top:2.5mm!important}
td.top .vt{margin:0 auto}
table.flow td.obs div{white-space:nowrap;line-height:1.7}
table.flow td.vleft{vertical-align:middle;padding:2mm 1mm 2mm 2mm}
.vrow{display:flex;justify-content:flex-start;align-items:center;direction:ltr}
.vcol{display:flex;flex-direction:column;align-items:center;position:relative}
.vsig{position:absolute;top:0;bottom:0;left:calc(100% + 1.5mm);border-right:1px dotted #9aa8ae}
.vt1{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:700;line-height:1.2}
table.pt td.sig{vertical-align:top;padding-top:1.6mm;font-weight:700;font-size:calc(12px*var(--fz))}
.vt{display:inline-block;vertical-align:middle;text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);margin:auto;font-weight:700;font-size:calc(12.5px*var(--fz));line-height:1.9;max-height:118mm;white-space:pre-wrap}
/* محضر فتح المظاريف */
.formbar{display:grid;grid-template-columns:auto 1fr auto auto;border:1.5px solid #333;background:#e3efd9;margin:4mm 0 6mm;font-size:calc(17px*var(--fz));font-weight:700}
.formbar div{padding:3mm 5mm;border-inline-start:1.5px solid #333;display:flex;align-items:center}
.formbar div:first-child{border:0}
.formbar .nm{font-size:calc(20px*var(--fz))}
.formbar .no{font-size:calc(22px*var(--fz));justify-content:center;min-width:20mm}
table.pt.big th{font-size:calc(15px*var(--fz));padding:3mm 2mm;background:#e3efd9;color:#111!important;border-color:#333}
table.pt.big td{font-size:calc(15px*var(--fz));padding:3mm 2mm;border-color:#333;background:#fff!important}
table.pt.big td.stmt{font-size:calc(16px*var(--fz));font-weight:600;padding:5mm 4mm;line-height:1.9}
table.pt.big td.sec{font-weight:800;font-size:calc(16px*var(--fz));background:#f3f7ef!important}
.notes-lines{margin-top:8mm;font-size:calc(15px*var(--fz))}
.notes-lines div{border-bottom:1px dotted #777;height:10mm}
/* المخالفة */
.viol .vgrid{display:grid;gap:3mm;margin-bottom:3mm}
.viol .g3{grid-template-columns:2fr 1.3fr 1fr}
.viol .g4{grid-template-columns:repeat(4,1fr)}
.viol .g2{grid-template-columns:1fr 1fr}
fieldset.vf{border:1.4px solid var(--rp);border-radius:7px;margin:0 0 3mm;padding:1mm 4mm 2.5mm;min-width:0}
.vgrid fieldset.vf{margin:0}
fieldset.vf legend{color:var(--rp);font-weight:700;font-size:calc(13.5px*var(--fz));padding:0 2mm}
fieldset.vf > div{font-size:calc(14.5px*var(--fz));font-weight:600;text-align:center;min-height:7mm;line-height:1.8}
fieldset.vf.tall > div{text-align:right;min-height:34mm}
fieldset.vf.mid > div{text-align:right;min-height:22mm}
.vopts{display:flex;flex-wrap:wrap;gap:1mm 5mm;justify-content:center}
.vopts span{color:#777;font-weight:500}
.vopts span.on{color:#111;font-weight:700}
.vopts span.on::first-letter{color:var(--rp)}
.vsign{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;margin-top:auto;padding-top:8mm;text-align:center;font-weight:700;font-size:calc(14px*var(--fz))}
.vsign span{display:block;color:var(--rp);font-size:calc(13px*var(--fz))}
.vsign i{display:block;font-style:normal;font-weight:500;margin-top:3mm}
.viol-form{margin-bottom:16px}
.vchks{display:flex;flex-wrap:wrap;gap:6px 14px}
.vchk{display:inline-flex;align-items:center;gap:6px;min-height:36px;font-size:calc(15px*var(--fz))}
.vchk input{width:20px;height:20px;accent-color:var(--teal)}
.vchks .sep{flex-basis:100%;height:0}
/* المخطط */
.chart-box{border:1px solid #333;border-radius:4px;padding:4mm;flex:1;min-width:0}
.mini-ins{display:grid;grid-template-columns:repeat(5,1fr);gap:4mm;margin-top:6px}
.mini-ins div{border:1px solid #9bb3b0;border-radius:8px;padding:2mm;text-align:center;font-size:calc(10.5px*var(--fz));font-weight:600}
.notes{border:1.5px solid var(--rp);border-radius:10px;padding:3mm 4mm;margin-top:6px;font-size:calc(11px*var(--fz))}
.notes b{color:var(--rp)}
.notes ul{margin:2px 0 0;padding-inline-start:18px}

@media (max-width:900px){
  .report-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .entry-grid,.dist-cards{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .entry{min-height:130px}
}

@media print{
  body{background:#fff}
  .topbar,.rep-bar,.no-print,.toast{display:none!important}
  main{padding:0;max-width:none}
  .paper-wrap{overflow:visible;padding:0}
  .sheet{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="page-size">@page{size:A4 portrait;margin:0}</style>
</head>
<body>
<header class="topbar">
  <button class="back" id="btn-back" hidden>‹ الرئيسية</button>
  <h1 id="top-title">لجان الاختبار</h1>
  <span class="saved" id="saved-ind">محفوظ</span>
</header>
<main id="app"></main>
<datalist id="dl-teachers"></datalist>
<datalist id="dl-committees"></datalist>
<datalist id="dl-grades"></datalist>
<datalist id="dl-subjects"></datalist>
<datalist id="dl-days"><option value="الأحد"><option value="الاثنين"><option value="الثلاثاء"><option value="الأربعاء"><option value="الخميس"></datalist>
<datalist id="dl-periods"><option value="الأولى"><option value="الثانية"><option value="الثالثة"></datalist>
<input type="file" id="file-xlsx" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="file-logo" accept="image/*" hidden>
<input type="file" id="file-wm" accept="image/*" hidden>

<script>
"use strict";
/* ======================= البيانات ======================= */
const STORE_KEY = "examCommitteesApp.v1";
const HEADERS = ["العام الدراسي","الفصل الدراسي","اسم المدرسة","مدير المدرسة","وكيل المدرسة","الموجه الطلابي","المعلمون","أعضاء لجنة التحكم والضبط",
  "رقم الهوية","اسم الطالب","رقم الجلوس","الصف","القسم","اللجنة",
  "اليوم"," التاريخ ","الفترة","من","الى","الصف ","المادة","المعلم المصحح1","المعلم المراجع1","المعلم المصحح2","المعلم المراجع2","المعلم المدقق",
  "اللجنة","مقر اللجنة","ملاحظ 1","ملاحظ 2","احتياط 1","احتياط 2","التحكم والضبط","الرصد واستخراج النتائج","المدقق","أعضاء لجنة الرصد وإخراج النتائج"];
const COL = i => { let s="", n=i+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; };

const GENERAL_FIELDS = [
  {k:"year",label:"العام الدراسي",ph:"1447 - 1448 هـ"},
  {k:"term",label:"الفصل الدراسي",ph:"الثاني"},
  {k:"school",label:"اسم المدرسة",ph:"ثانوية ..."},
  {k:"principal",label:"مدير المدرسة"},
  {k:"deputy",label:"وكيل المدرسة"},
  {k:"counselor",label:"الموجه الطلابي"},
];
const STUDENT_FIELDS = [
  {k:"id",label:"رقم الهوية",type:"tel",col:8},
  {k:"name",label:"اسم الطالب",col:9,wide:true},
  {k:"seat",label:"رقم الجلوس",type:"tel",col:10},
  {k:"grade",label:"الصف",col:11,list:"dl-grades",ph:"1ث - 1"},
  {k:"section",label:"القسم",col:12,ph:"السنة المشتركة"},
  {k:"committee",label:"اللجنة",col:13,list:"dl-committees",ph:"الأولى"},
];
const DIST_FIELDS = [
  {k:"day",label:"اليوم",list:"dl-days",g:"الاختبار"},
  {k:"date",label:"التاريخ",ph:"28-12-1447هـ",g:"الاختبار"},
  {k:"period",label:"الفترة",list:"dl-periods",g:"الاختبار"},
  {k:"from",label:"من",ph:"7:00 ص",g:"الاختبار"},
  {k:"to",label:"إلى",ph:"9:30 ص",g:"الاختبار"},
  {k:"grade",label:"الصف",opts:()=>GRADES,g:"الاختبار"},
  {k:"subject",label:"المادة",list:"dl-subjects",g:"الاختبار"},
  {k:"c1",label:"المعلم المصحح 1",opts:teacherOpts,g:"التصحيح والمراجعة"},
  {k:"r1",label:"المعلم المراجع 1",opts:teacherOpts,g:"التصحيح والمراجعة"},
  {k:"c2",label:"المعلم المصحح 2",opts:teacherOpts,g:"التصحيح والمراجعة"},
  {k:"r2",label:"المعلم المراجع 2",opts:teacherOpts,g:"التصحيح والمراجعة"},
  {k:"aud",label:"المعلم المدقق",opts:teacherOpts,g:"التصحيح والمراجعة"},
  {k:"com",label:"اللجنة",opts:()=>COMS10,g:"اللجنة والملاحظة"},
  {k:"loc",label:"مقر اللجنة",opts:()=>LOCS,g:"اللجنة والملاحظة"},
  {k:"o1",label:"ملاحظ 1",opts:teacherOpts,g:"اللجنة والملاحظة"},
  {k:"o2",label:"ملاحظ 2",opts:teacherOpts,g:"اللجنة والملاحظة"},
  {k:"s1",label:"احتياط 1",opts:teacherOpts,g:"اللجنة والملاحظة"},
  {k:"s2",label:"احتياط 2",opts:teacherOpts,g:"اللجنة والملاحظة"},
  {k:"ctrl",label:"التحكم والضبط",opts:teacherOpts,g:"لجنة التحكم والضبط والرصد"},
  {k:"mon",label:"الرصد واستخراج النتائج",opts:teacherOpts,g:"لجنة التحكم والضبط والرصد"},
  {k:"aud2",label:"المدقق",opts:teacherOpts,g:"لجنة التحكم والضبط والرصد"},
];
DIST_FIELDS.forEach((f,i)=>f.col=14+i);
const GRADES=["الأول الثانوي (السنة المشتركة)","الثاني الثانوي","الثالث الثانوي"];
const COMS10=["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة","الثامنة","التاسعة","العاشرة"];
const LOCS=["1ث1","1ث2","2ث1","2ث2","3ث1","3ث2"];
function teacherOpts(){ return uniq([...S.teachers,...S.control,...S.monitors]); }
GENERAL_FIELDS.forEach((f,i)=>f.col=i);

const DEFAULT_INS=["الحضور قبل الاختبار بوقت كافٍ مع إحضار الهوية المدرسية، والالتزام بالهدوء داخل القاعة والتقيد بالتعليمات.","الإجابة بالقلم الأزرق الجاف غير القابل للمحو، ويُمنع اصطحاب المقررات الدراسية أو ما له علاقة بالمادة.","يُمنع منعًا باتًا دخول أجهزة الجوال وغيرها إلى قاعة الاختبار.","التأكيد على أولياء الأمور بالالتزام بالحضور مع بداية الوقت المخصص لانصراف الطلاب."].join("\n");
function blank(){ return {general:{year:"",term:"",school:"",principal:"",deputy:"",counselor:""},teachers:[],control:[],monitors:[],students:[],dist:[],
  settings:{region:"منطقة عسير",track:"",logo:"",instructions:DEFAULT_INS,wm:"asir",wmImg:""}}; }

let S = blank();
function load(){ try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ const d=JSON.parse(raw); S = Object.assign(blank(), d); S.settings = Object.assign(blank().settings, d.settings||{}); S.general=Object.assign(blank().general,d.general||{}); } }catch(e){} }
let saveTimer;
function save(){ const ind=document.getElementById("saved-ind"); ind.textContent="جارٍ الحفظ…";
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); ind.textContent="محفوظ"; }catch(e){ ind.textContent="تعذّر الحفظ في المتصفح — صدّر ملف Excel"; } refreshLists(); },250); }

/* ======================= أدوات ======================= */
const $ = s => document.querySelector(s);
const esc = v => String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AR = "٠١٢٣٤٥٦٧٨٩";
const ar = v => esc(v).replace(/[0-9]/g,d=>AR[d]);
const latin = v => String(v??"").replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const norm = v => String(v??"").trim().replace(/\s+/g," ");
const uniq = arr => [...new Set(arr.map(norm).filter(Boolean))];
const ORD = ["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة","الثامنة","التاسعة","العاشرة","الحادية عشرة","الثانية عشرة","الثالثة عشرة","الرابعة عشرة","الخامسة عشرة","السادسة عشرة","السابعة عشرة","الثامنة عشرة","التاسعة عشرة","العشرون"];
const normOrd = s => norm(s).replace(/[إأآ]/g,"ا").replace(/ى$/,"ي");
function rankOrd(s){ const n=normOrd(s); const i=ORD.findIndex(o=>normOrd(o)===n); if(i>=0) return i; const num=parseInt(latin(s).replace(/\D+/g," ").trim()); return isNaN(num)?500:num-1; }
const cmpOrd = (a,b)=> rankOrd(a)-rankOrd(b) || String(a).localeCompare(String(b),"ar");
function dateKey(d, fallback){ const nums = latin(d).match(/\d+/g); if(!nums||nums.length<3) return 1e9+fallback;
  let [a,b,c]=nums.map(Number); if(String(nums[0]).length===4) return a*10000+b*100+c; return c*10000+b*100+a; }
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

function committees(){ return uniq([...S.students.map(s=>s.committee), ...S.dist.map(d=>d.com)]).sort(cmpOrd); }
function studentsOf(c){ return S.students.filter(s=>norm(s.committee)===norm(c)).sort((a,b)=>(parseFloat(latin(a.seat))||0)-(parseFloat(latin(b.seat))||0)); }
function locationOf(c){ const d=S.dist.find(x=>norm(x.com)===norm(c)&&norm(x.loc)); return d?d.loc:""; }
function sessions(){ const map=new Map(); S.dist.forEach((d,i)=>{ if(!norm(d.date)&&!norm(d.day)) return; const k=norm(d.day)+"|"+norm(d.date)+"|"+norm(d.period);
  if(!map.has(k)) map.set(k,{key:k,day:norm(d.day),date:norm(d.date),period:norm(d.period),dk:dateKey(d.date,i),rows:[]}); map.get(k).rows.push(d); });
  return [...map.values()].sort((a,b)=>a.dk-b.dk || rankOrd(a.period)-rankOrd(b.period)); }
const sessLabel = s => [s.day,s.date,s.period?("الفترة "+s.period):""].filter(Boolean).join(" — ");

function refreshLists(){
  const fill=(id,arr)=>{ $("#"+id).innerHTML = arr.map(v=>`<option value="${esc(v)}">`).join(""); };
  fill("dl-teachers", teacherOpts());
  fill("dl-committees", uniq([...committees(), ...ORD.slice(0,10)]));
  fill("dl-grades", uniq([...S.dist.map(d=>d.grade),...S.students.map(s=>s.grade),"الأول الثانوي","الثاني الثانوي","الثالث الثانوي"]));
  fill("dl-subjects", uniq(S.dist.map(d=>d.subject)));
}

/* ======================= التوجيه ======================= */
const REPORTS = [
  {id:"cover",t:"غلاف اللجنة",d:"لوحة باب كل لجنة: رقمها ومقرها وعدد طلابها",o:"عمودي"},
  {id:"roll",t:"كشف المناداة",d:"استلام ورقة الإجابة لكل لجنة",o:"عمودي"},
  {id:"cards",t:"بطاقات الجلوس",d:"عشر بطاقات في كل صفحة",o:"عمودي"},
  {id:"schedule",t:"جدول الاختبارات",d:"الأيام والفترات والمواد لكل صف",o:"أفقي"},
  {id:"load",t:"عدد اللجان لكل معلم",d:"جدول ورسم بياني لتوزيع الملاحظة",o:"أفقي"},
  {id:"marking",t:"التصحيح والمراجعة",d:"المصححون والمراجعون والمدقق لكل مادة",o:"أفقي"},
  {id:"observers",t:"بيان الملاحظين",d:"ملاحظو اللجان والاحتياط لكل فترة",o:"أفقي"},
  {id:"handover",t:"سير ورقة الإجابة",d:"مسار ورقة الإجابة من اللجنة إلى الحفظ",o:"أفقي"},
  {id:"envelope",t:"محضر فتح مظاريف الأسئلة",d:"محضر واحد لكل فترة بجميع موادها",o:"عمودي"},
  {id:"violation",t:"مخالفة أنظمة الاختبارات",d:"محضر مخالفة لطالب والإجراء المتخذ",o:"عمودي"},
];
let reportOpts = {};
function go(h){ location.hash = h; }
function route(){
  const h = location.hash.replace("#","") || "home";
  const [view, arg] = h.split("-r-");
  $("#btn-back").hidden = view==="home";
  setPage("portrait");
  window.scrollTo(0,0);
  if(view==="general") return viewGeneral();
  if(view==="students") return viewStudents();
  if(view==="dist") return viewDist();
  if(view==="report") return viewReport(arg);
  viewHome();
}
function setTitle(t){ $("#top-title").textContent=t; document.title = t==="لجان الاختبار"?t:("لجان الاختبار · "+t); }
function setPage(o){ $("#page-size").textContent = `@page{size:A4 ${o};margin:0}`; }

/* ======================= الرئيسية ======================= */
const ICONS = {
  gen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/></svg>',
  stu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.8-3.5 3.2-5 6-5s5.2 1.5 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.5c2.4 0 4.2 1.3 5 4"/></svg>',
  dis:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h7"/></svg>'
};
function viewHome(){
  setTitle("لجان الاختبار");
  const g=S.general, ses=sessions();
  const has = S.students.length || S.dist.length || g.school;
  $("#app").innerHTML = `
  <section class="hero">
    <div>
      <p class="school">${esc(g.school||"لجان الاختبار")}</p>
      <p class="sub">${esc([g.year?("العام الدراسي "+g.year):"", g.term?("الفصل الدراسي "+g.term):""].filter(Boolean).join(" · ") || "ابدأ بإدخال البيانات العامة أو استيراد ملف Excel")}</p>
    </div>
    <div class="stats">
      <div class="stat"><b>${ar(S.students.length)}</b><span>طالب</span></div>
      <div class="stat"><b>${ar(committees().length)}</b><span>لجنة</span></div>
      <div class="stat"><b>${ar(S.teachers.length)}</b><span>معلم</span></div>
      <div class="stat"><b>${ar(ses.length)}</b><span>فترة اختبار</span></div>
    </div>
  </section>

  <div class="section-title">إدخال البيانات</div>
  <div class="entry-grid">
    <button class="entry" data-go="general">${ICONS.gen}<span class="cols">A – H · AJ</span><h2>بيانات عامة</h2><p>المدرسة والإدارة والمعلمون ولجنتا التحكم والضبط والرصد</p><span class="count">${g.school?"مكتملة جزئيًا":"لم تُعبّأ بعد"} · ${ar(S.teachers.length)} معلم</span></button>
    <button class="entry" data-go="students">${ICONS.stu}<span class="cols">I – N</span><h2>بيانات الطلاب</h2><p>الهوية والاسم ورقم الجلوس والصف واللجنة</p><span class="count">${ar(S.students.length)} طالب مسجّل</span></button>
    <button class="entry" data-go="dist">${ICONS.dis}<span class="cols">O – AI</span><h2>بيانات التوزيع</h2><p>الجدول والتصحيح والملاحظة والتحكم والرصد</p><span class="count">${ar(S.dist.length)} سجل توزيع</span></button>
  </div>

  <div class="section-title">التقارير</div>
  <div class="report-grid">
    ${REPORTS.map((r,i)=>`<button class="rep" data-go="report-r-${r.id}"><span class="no">تقرير ${ar(i+1)}</span><b>${r.t}</b><span>${r.d}</span><span class="orient">A4 ${r.o}</span></button>`).join("")}
  </div>

  <div class="section-title">ملف Excel والإعدادات</div>
  <div class="tools">
    <button class="btn primary" id="b-import">استيراد ملف Excel</button>
    <button class="btn sand" id="b-export">حفظ إلى ملف Excel</button>

/* إضافة أسماء من Excel: لصق عمود أو اختيار ملف (يُقرأ أول عمود فيه أسماء) */
function namesFromExcel(title, done){
  const back=modalShell(`<h3>${esc(title)}</h3>
    <p class="hint" style="margin-top:0">انسخ عمود الأسماء من Excel والصقه هنا، أو اختر ملف Excel وسيُقرأ أول عمود فيه أسماء.</p>
    <div class="fld"><textarea id="nx-area" style="min-height:200px" placeholder="اسم في كل سطر"></textarea></div>
    <div class="foot"><button class="btn primary" id="nx-ok">إضافة الأسماء</button><button class="btn sand" id="nx-file">اختيار ملف Excel</button><button class="btn" id="nx-x">إلغاء</button>
    <input type="file" id="nx-input" accept=".xlsx,.xls,.csv" hidden></div>`);
  const parse=t=>t.split(/\r?\n/).map(l=>norm(l.split("\t")[0])).filter(n=>n&&!/^(م|الاسم|اسم|المعلم|المعلمون|أعضاء.*)$/.test(n)&&!/^\d+$/.test(latin(n)));
  back.querySelector("#nx-x").onclick=()=>back.remove();
  back.querySelector("#nx-ok").onclick=()=>{ const names=uniq(parse(back.querySelector("#nx-area").value)); back.remove(); done(names); };
  back.querySelector("#nx-file").onclick=()=>back.querySelector("#nx-input").click();
  back.querySelector("#nx-input").onchange=e=>{ const f=e.target.files[0]; if(!f) return; if(typeof XLSX==="undefined"){ toast("مكتبة Excel لم تُحمّل — تأكد من الاتصال بالإنترنت"); return; }
    const rd=new FileReader(); rd.onload=ev=>{ try{ const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
      const width=Math.max(0,...rows.map(r=>r.length)); let best=-1,bc=0;
      for(let c=0;c<width;c++){ const cnt=rows.filter(r=>/[\u0600-\u06FF]{2,}\s+[\u0600-\u06FF]{2,}/.test(String(r[c]||""))).length; if(cnt>bc){bc=cnt;best=c;} }
      if(best<0){ toast("لم أجد عمود أسماء في الملف"); return; }
      back.querySelector("#nx-area").value=rows.map(r=>norm(r[best])).filter(Boolean).join("\n"); toast("راجع الأسماء ثم اضغط «إضافة الأسماء»");
    }catch(err){ toast("تعذّرت قراءة الملف"); } }; rd.readAsArrayBuffer(f); };
}

/* ======================= الطلاب ======================= */
let stuFilter = "";
function viewStudents(){
  setTitle("بيانات الطلاب");
  $("#app").innerHTML = `
  <div class="toolbar">
    <button class="btn primary" id="b-add">إضافة طالب</button>
    <button class="btn" id="b-paste">لصق قائمة من Excel</button>
    <div class="search"><input id="q" type="search" placeholder="بحث بالاسم أو الهوية أو اللجنة" value="${esc(stuFilter)}"></div>
  </div>
  <div id="stu-table"></div>`;
  $("#b-add").onclick=()=>editStudent(-1);
  $("#b-paste").onclick=pasteStudents;
  $("#q").oninput=e=>{stuFilter=e.target.value;drawStudents();};
  drawStudents();
}
function drawStudents(){
  const q=norm(stuFilter);
  const rows=S.students.map((s,i)=>({s,i})).filter(({s})=>!q||STUDENT_FIELDS.some(f=>String(s[f.k]||"").includes(q)));
  if(!S.students.length){ $("#stu-table").innerHTML=`<div class="table-wrap"><div class="empty"><b>لا يوجد طلاب بعد</b>أضف طالبًا، أو الصق أعمدة الطلاب من Excel (الهوية، الاسم، رقم الجلوس، الصف، القسم، اللجنة).</div></div>`; return; }
  $("#stu-table").innerHTML = `<div class="table-wrap"><table class="data"><thead><tr><th>م</th>${STUDENT_FIELDS.map(f=>`<th>${f.label} <span style="color:var(--sand)">${COL(f.col)}</span></th>`).join("")}<th></th></tr></thead><tbody>
  ${rows.map(({s,i},n)=>`<tr><td>${n+1}</td>${STUDENT_FIELDS.map(f=>`<td>${esc(s[f.k])}</td>`).join("")}<td class="acts"><button class="iconbtn" data-e="${i}" aria-label="تعديل">✎</button><button class="iconbtn" data-d="${i}" aria-label="حذف">🗑</button></td></tr>`).join("")}
  </tbody></table></div><p class="hint">${ar(rows.length)} من ${ar(S.students.length)} طالب</p>`;
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>editStudent(+b.dataset.e));
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>confirmBox(`حذف الطالب «${S.students[+b.dataset.d].name}»؟`,"حذف",()=>{S.students.splice(+b.dataset.d,1);save();drawStudents();}));
}
function editStudent(i){
  const s = i>=0? S.students[i] : (()=>{ const last=S.students[S.students.length-1]||{}; const seat=parseInt(latin(last.seat)); return {grade:last.grade||"",section:last.section||"",committee:last.committee||"",seat:isNaN(seat)?"":String(seat+1)}; })();
  formModal(i>=0?"تعديل بيانات طالب":"إضافة طالب", STUDENT_FIELDS, s, (val,again)=>{
    if(!norm(val.name)){ toast("اكتب اسم الطالب"); return false; }
    if(i>=0) S.students[i]=val; else S.students.push(val);
    save(); drawStudents(); toast(i>=0?"تم حفظ التعديل":"تمت إضافة الطالب");
    if(again) setTimeout(()=>editStudent(-1),50);
    return true;
  }, i<0);
}
function pasteStudents(){
  const back=modalShell(`<h3>لصق قائمة طلاب</h3>
    <p class="hint" style="margin-top:0">انسخ الأعمدة من Excel بالترتيب: رقم الهوية، اسم الطالب، رقم الجلوس، الصف، القسم، اللجنة — ثم الصقها هنا. كل سطر طالب.</p>
    <div class="fld"><textarea id="paste-area" style="min-height:220px" placeholder="1152264923	أحمد يحيى العمري	1	1ث - 1	السنة المشتركة	الأولى"></textarea></div>
    <div class="foot"><button class="btn primary" id="p-ok">إضافة الطلاب</button><button class="btn" id="p-x">إلغاء</button></div>`);
  $("#p-x").onclick=()=>back.remove();
  $("#p-ok").onclick=()=>{ const lines=$("#paste-area").value.split(/\r?\n/).filter(l=>l.trim()); let n=0;
    lines.forEach(l=>{ const c=l.split(/\t|;|,(?=\S)/).map(x=>x.trim()); if(c.length<2) return; if(/هوية|اسم الطالب/.test(l)) return;
      const s={}; STUDENT_FIELDS.forEach((f,j)=>s[f.k]=c[j]||""); S.students.push(s); n++; });
    back.remove(); save(); drawStudents(); toast(`تمت إضافة ${n} طالب`); };
}

function viewDist(){
  setTitle("بيانات التوزيع");
  $("#app").innerHTML = `
  <div class="toolbar">
    <button class="btn primary" id="b-add">إضافة سجل توزيع</button>
    <span class="hint" style="margin:0">كل سجل = صف واحد في ملف Excel من العمود O إلى AI. انسخ سجلًا لتكرار نفس اليوم والفترة للجان أخرى.</span>
  </div>
  <div id="dist-list"></div>`;
  $("#b-add").onclick=()=>editDist(-1);
  drawDist();
}
function drawDist(){
  if(!S.dist.length){ $("#dist-list").innerHTML=`<div class="table-wrap"><div class="empty"><b>لا توجد سجلات توزيع</b>أضف سجلًا لكل اختبار ولجنة: اليوم والفترة والمادة، ثم المصححين والملاحظين والكنترول.</div></div>`; return; }
  const groups=new Map();
  S.dist.forEach((d,i)=>{ const k=norm(d.day)+"|"+norm(d.date)+"|"+norm(d.period); if(!groups.has(k)) groups.set(k,{d,dk:dateKey(d.date,i),items:[]}); groups.get(k).items.push({d,i}); });
  const gs=[...groups.values()].sort((a,b)=>a.dk-b.dk||rankOrd(a.d.period)-rankOrd(b.d.period));
  $("#dist-list").innerHTML = gs.map(g=>`<div class="dist-group"><h4>${esc([g.d.day,g.d.date].filter(Boolean).join(" · ")||"بدون تاريخ")} <span class="pill">الفترة ${esc(g.d.period||"—")}</span> <span class="hint" style="margin:0">${ar(g.items.length)} سجل</span></h4>
    <div class="dist-cards">${g.items.sort((a,b)=>cmpOrd(a.d.com,b.d.com)).map(({d,i})=>`<div class="dcard">
      <div class="top"><div><div class="subj">${esc(d.subject||"—")}</div><div class="meta">${esc(d.grade||"")} ${d.from||d.to?("· "+esc(d.from)+" – "+esc(d.to)):""}</div></div>
      <div class="meta">${d.com?("اللجنة "+esc(d.com)):""}${d.loc?("<br>"+esc(d.loc)):""}</div></div>
      <div class="kv"><span>الملاحظان</span><span>${esc([d.o1,d.o2].filter(Boolean).join("، ")||"—")}</span>
      <span>التصحيح</span><span>${esc([d.c1,d.c2].filter(Boolean).join("، ")||"—")}</span></div>
      <div class="acts"><button class="btn small" data-e="${i}">تعديل</button><button class="btn small" data-c="${i}">نسخ</button><button class="btn small danger" data-d="${i}">حذف</button></div>
    </div>`).join("")}</div></div>`).join("");
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>editDist(+b.dataset.e));
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ const c=Object.assign({},S.dist[+b.dataset.c]); c.com="";c.loc="";c.o1="";c.o2=""; editDist(-1,c); });

function modalShell(html){ const back=document.createElement("div"); back.className="modal-back"; back.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;

function formModal(title, fields, data, onSave, allowAgain, againLabel){

  const back=modalShell(`<h3>${title}</h3><form id="mform">${lastG?body+"</div>":`<div class="form-grid">${body}</div>`}
    <div class="foot"><button type="submit" class="btn primary">حفظ</button>${allowAgain?`<button type="button" class="btn sand" id="m-again">${againLabel||"حفظ وإضافة آخر"}</button>`:""}<button type="button" class="btn" id="m-x">إلغاء</button></div></form>`);

function exportXlsx(){
  if(typeof XLSX==="undefined"){ toast("مكتبة Excel لم تُحمّل — تأكد من الاتصال بالإنترنت"); return; }
  const g=S.general;
  const n=Math.max(1, S.teachers.length, S.control.length, S.monitors.length, S.students.length, S.dist.length);
  const aoa=[HEADERS.slice()];
  for(let r=0;r<n;r++){
    const row=new Array(36).fill("");
    if(r===0) GENERAL_FIELDS.forEach(f=>row[f.col]=g[f.k]||"");
    row[6]=S.teachers[r]||""; row[7]=S.control[r]||""; row[35]=S.monitors[r]||"";
    const s=S.students[r]; if(s) STUDENT_FIELDS.forEach(f=>row[f.col]=numIfId(s[f.k],f.k));
    const d=S.dist[r]; if(d) DIST_FIELDS.forEach(f=>row[f.col]=d[f.k]||"");
    aoa.push(row);
  }
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=HEADERS.map((h,i)=>({wch: i===9?28 : (i>=6&&i<=7)||i>=21? 20 : 13}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"بيانات");
  wb.Workbook={Views:[{RTL:true}]};
  const name=`بيانات_اللجان_${(g.school||"المدرسة").replace(/[\\/:*?"<>|]/g,"")}.xlsx`;
  XLSX.writeFile(wb,name);
  toast("تم إنشاء ملف Excel");
}
function numIfId(v,k){ if((k==="id"||k==="seat") && /^\d+$/.test(latin(v))) return Number(latin(v)); return v||""; }
function importXlsx(file){
  if(typeof XLSX==="undefined"){ toast("مكتبة Excel لم تُحمّل — تأكد من الاتصال بالإنترنت"); return; }
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      const ws=wb.Sheets[wb.SheetNames.includes("بيانات")?"بيانات":wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""}).slice(1);
      const N=blank(); N.settings=S.settings;
      const cell=(r,i)=>norm(r[i]);
      if(rows[0]) GENERAL_FIELDS.forEach(f=>N.general[f.k]=cell(rows[0],f.col));
      rows.forEach(r=>{
        if(cell(r,6)) N.teachers.push(cell(r,6));
        if(cell(r,7)) N.control.push(cell(r,7));
        if(cell(r,35)) N.monitors.push(cell(r,35));
        if(STUDENT_FIELDS.some(f=>cell(r,f.col))){ const s={}; STUDENT_FIELDS.forEach(f=>s[f.k]=cell(r,f.col)); N.students.push(s); }
        if(DIST_FIELDS.some(f=>cell(r,f.col))){ const d={}; DIST_FIELDS.forEach(f=>d[f.k]=cell(r,f.col)); N.dist.push(d); }
      });
      N.teachers=uniq(N.teachers); N.control=uniq(N.control); N.monitors=uniq(N.monitors);
      S=N; save(); route();
      toast(`تم الاستيراد: ${N.students.length} طالب، ${N.dist.length} سجل توزيع، ${N.teachers.length} معلم`);
    }catch(err){ toast("تعذّرت قراءة الملف. تأكد أنه ملف Excel بنفس الأعمدة."); }
  };
  rd.readAsArrayBuffer(file);
}

/* ======================= العلامة المائية: هوية عسير ======================= */
const svgURI = svg => "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
const QATT = ["#2f7d5b","#e0b13a","#c0392b","#2b5f9e"];
const WM = (()=>{
  /* شريط القط العسيري: مثلثات متناوبة الألوان */
  let tri=""; for(let i=0;i<8;i++){ const x=i*12; tri+=`<polygon points="${x},12 ${x+6},0 ${x+12},12" fill="${QATT[i%4]}"/><polygon points="${x+6},0 ${x+12},12 ${x+18},0" fill="${QATT[(i+2)%4]}" opacity=".55"/>`; }
  const band = svgURI(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="12" viewBox="0 0 96 12">${tri}</svg>`);
  /* بيوت حجرية عسيرية متدرجة الطبقات */
  const towers=[[8,58,52,104],[56,22,62,140],[114,68,50,94],[160,96,44,66]]; let t="";
  towers.forEach(([x,y,w,h],ti)=>{ t+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#7a6650"/>`;
    for(let ly=y+16;ly<y+h-4;ly+=17) t+=`<rect x="${x-1}" y="${ly}" width="${w+2}" height="2.4" fill="#efe7da"/>`;
    for(let cx=x;cx<x+w;cx+=8) t+=`<polygon points="${cx},${y} ${cx+4},${y-6} ${cx+8},${y}" fill="#efe7da"/>`;
    for(let wy=y+5;wy<y+h-14;wy+=17) for(let wx=x+7;wx<x+w-10;wx+=15){ t+=`<polygon points="${wx-2},${wy+3} ${wx+4},${wy-2} ${wx+10},${wy+3}" fill="#efe7da"/><rect x="${wx}" y="${wy+3}" width="8" height="9" fill="#4a3c2e"/>`; }
  });
  const houses = svgURI(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 164">${t}<rect x="0" y="160" width="212" height="4" fill="#7a6650"/></svg>`);
  /* معين القط العسيري في الوسط */
  let d=""; for(let i=0;i<7;i++){ const r=100-i*14; d+=`<polygon points="100,${100-r} ${100+r},100 100,${100+r} ${100-r},100" fill="none" stroke="${QATT[i%4]}" stroke-width="${i%2?3:6}"/>`; }
  for(let i=0;i<4;i++){ const a=i*90; d+=`<g transform="rotate(${a} 100 100)"><polygon points="100,0 108,12 92,12" fill="${QATT[i]}"/></g>`; }
  const diamond = svgURI(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 208 208">${d}</svg>`);
  return {band,houses,diamond};
})();

        <thead><tr><th>م</th><th>رقم الهوية</th><th>اسم الطالب</th><th>رقم الجلوس</th><th>الصف</th><th>القسم</th><th>اللجنة</th><th>زمن الخروج</th><th>التوقيع</th></tr></thead>
        <tbody>${p.map((s,i)=>`<tr style="height:${rh}mm"><td>${ar(i+1)}</td><td>${ar(s.id)}</td><td class="name">${esc(s.name)}</td><td><b>${ar(s.seat)}</b></td><td>${ar(s.grade)}</td><td>${esc(s.section)}</td><td>${esc(s.committee)}</td><td></td><td></td></tr>`).join("")}
        ${pi===pages.length-1? Array(Math.max(0,Math.min(2,24-p.length))).fill(`<tr style="height:${rh}mm"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join(""):""}</tbody></table>
        <div class="sign-lines"><div>١- الملاحظ: ${obs[0]?esc(obs[0]):"............................................"} &nbsp;&nbsp; التوقيع: .........................</div>

    }).join(""); },

  cards(o){ const g=S.general; const st=[...S.students].filter(s=>!o.com||norm(s.committee)===norm(o.com)).sort((a,b)=>cmpOrd(a.committee,b.committee)||(parseFloat(latin(a.seat))||0)-(parseFloat(latin(b.seat))||0)); if(!st.length) return "";

    </div>`).join("")}</div></div>`).join(""); },

  schedule(){ const g=S.general; const rows=S.dist.filter(d=>norm(d.subject)&&norm(d.grade)); if(!rows.length) return "";
    const grades=uniq(rows.map(d=>d.grade)).sort((a,b)=>rankGrade(a)-rankGrade(b));
    const ses=sessions().filter(s=>s.rows.some(r=>norm(r.subject)));
    const byDay=new Map(); ses.forEach(s=>{ const k=s.day+"|"+s.date; if(!byDay.has(k)) byDay.set(k,[]); byDay.get(k).push(s); });
    const cell=(s,gr)=>{ const r=s.rows.find(x=>norm(x.grade)===gr&&norm(x.subject)); return r? [ar([r.from,r.to].filter(Boolean).join(" – ")), esc(r.subject)] : ["—","—"]; };
    const wGrade=Math.floor(70/grades.length);
    let body=""; byDay.forEach((list,k)=>{ const [day,date]=k.split("|"); list.forEach((s,i)=>{ body+=`<tr style="height:${Math.max(9,Math.min(16,105/ses.length))}mm">${i===0?`<td rowspan="${list.length}" style="font-weight:700;font-size:calc(13px*var(--fz))">${esc(day)}</td><td rowspan="${list.length}" style="font-weight:700">${ar(date)}</td>`:""}<td>${esc(s.period)}</td>${grades.map(gr=>{ const [t,sub]=cell(s,gr); return `<td style="white-space:nowrap;font-size:calc(11px*var(--fz))">${t}</td><td style="font-weight:700;font-size:calc(13px*var(--fz))">${sub}</td>`; }).join("")}</tr>`; }); });
    return `<div class="sheet land">${head()}
      <div class="p-title">جدول الاختبارات النهائية${g.term?(" للفصل الدراسي "+esc(g.term)):""}${g.year?(" — العام الدراسي "+ar(g.year)):""}</div>
      <table class="pt"><colgroup><col style="width:9%"><col style="width:12%"><col style="width:7%">${grades.map(()=>`<col style="width:${wGrade*0.45}%"><col style="width:${wGrade*0.55}%">`).join("")}</colgroup>
      <thead><tr><th rowspan="2">اليوم</th><th rowspan="2">التاريخ</th><th rowspan="2">الفترة</th>${grades.map(gr=>`<th colspan="2" style="background:var(--ra);border-color:var(--ra)">${esc(gr)}</th>`).join("")}</tr>
      <tr>${grades.map(()=>`<th>الزمن</th><th>المادة</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>
      ${(()=>{ const ins=String(S.settings.instructions||"").split(/\r?\n/).map(norm).filter(Boolean); return ins.length?`<div class="notes"><b>تعليمات هامة للطلاب:</b><ul>${ins.map(t=>`<li>${ar(t)}</li>`).join("")}</ul></div>`:""; })()}
      ${foot()}</div>`; },

  load(){ const counts=new Map(); const reserve=new Map(); const ctrl=new Set(S.control.map(norm));
    S.teachers.forEach(t=>{counts.set(norm(t),new Set());reserve.set(norm(t),new Set());});
    S.dist.forEach((d,i)=>{ const slot=dateKey(d.date,i)+"|"+norm(d.period)+"|"+norm(d.com);
      [d.o1,d.o2].map(norm).filter(Boolean).forEach(n=>{ if(!counts.has(n)){counts.set(n,new Set());reserve.set(n,new Set());} counts.get(n).add(slot); });
      [d.s1,d.s2].map(norm).filter(Boolean).forEach(n=>{ if(!counts.has(n)){counts.set(n,new Set());reserve.set(n,new Set());} reserve.get(n).add(norm(d.date)+"|"+norm(d.period)); }); });
    const list=[...counts.keys()].map(n=>({n,c:counts.get(n).size,r:reserve.get(n).size,ctl:ctrl.has(n)}));
    if(!list.length) return "";
    const total=list.reduce((a,b)=>a+b.c,0); const max=Math.max(1,...list.map(x=>x.c));
    const W=640,H=420,pb=120,pt=20,bw=(W-20)/list.length;
    const ticks=[...Array(max+1).keys()].filter(v=>max<=8||v%Math.ceil(max/8)===0);
    const y=v=>pt+(H-pb-pt)*(1-v/max);
    const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" font-family="IBM Plex Sans Arabic, Tahoma" style="direction:ltr">
      ${ticks.map(v=>`<line x1="10" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#e1e7e6"/><text x="6" y="${y(v)+4}" font-size="10" fill="#555" text-anchor="end">${v}</text>`).join("")}
      ${list.map((t,i)=>{ const x=W-10-(i+1)*bw+bw*0.18, w=bw*0.64, yy=y(t.c); return `<rect x="${x}" y="${yy}" width="${w}" height="${H-pb-yy}" style="fill:${t.ctl?"var(--ra)":"var(--rp)"}" rx="2"/>
        <text x="${x+w/2}" y="${yy-4}" font-size="14" font-weight="700" fill="#111" text-anchor="middle">${t.c}</text>
        <text transform="translate(${x+w/2},${H-pb+8}) rotate(-55)" font-size="${list.length>24?10:13}" fill="#111" text-anchor="end">${esc(t.n)}</text>`; }).join("")}
      <line x1="10" x2="${W-10}" y1="${H-pb}" y2="${H-pb}" stroke="#333"/></svg>`;
    const rowH=Math.min(7,120/list.length);
    return `<div class="sheet land">${head()}<div class="p-title">عدد اللجان عند كل معلم</div>
      <div style="display:flex;gap:6mm;flex:1;min-height:0">
        <div style="width:95mm;flex:none"><table class="pt"><colgroup><col style="width:12%"><col style="width:56%"><col style="width:16%"><col style="width:16%"></colgroup>
          <thead><tr><th>م</th><th>المعلم</th><th>اللجان</th><th>احتياط</th></tr></thead>
          <tbody>${list.map((t,i)=>`<tr style="height:${rowH}mm"><td>${ar(i+1)}</td><td class="name">${esc(t.n)}${t.ctl?' <span style="color:#a1262a;font-size:calc(9px*var(--fz))">(تحكم وضبط)</span>':""}</td><td style="${t.c===0?"background:#fbe3e3;color:#a1262a;font-weight:700":"font-weight:700"}">${ar(t.c)}</td><td>${ar(t.r)}</td></tr>`).join("")}
          <tr><td colspan="2" style="background:color-mix(in srgb,var(--rp) 14%,#fff);font-weight:700">مجموع اللجان</td><td colspan="2" style="background:color-mix(in srgb,var(--rp) 14%,#fff);font-weight:700">${ar(total)}</td></tr></tbody></table></div>
        <div class="chart-box"><div style="text-align:center;font-weight:700;font-size:calc(15px*var(--fz));color:var(--rp)">عدد اللجان <span style="font-size:calc(11px*var(--fz));color:#555">(الذهبي = عضو لجنة التحكم والضبط)</span></div><div style="height:calc(100% - 26px)">${svg}</div></div>
      </div>${foot()}</div>`; },

  marking(){ const rows=S.dist.filter(d=>norm(d.subject)); if(!rows.length) return "";
    const map=new Map(); rows.forEach((d,i)=>{ const k=norm(d.date)+"|"+norm(d.grade)+"|"+norm(d.subject); if(!map.has(k)) map.set(k,{d:Object.assign({},d),dk:dateKey(d.date,i)}); else { const m=map.get(k).d; ["c1","r1","c2","r2","aud"].forEach(f=>{ if(!norm(m[f])) m[f]=d[f]; }); } });
    const items=[...map.values()].sort((a,b)=>a.dk-b.dk||rankGrade(a.d.grade)-rankGrade(b.d.grade));
    const days=new Map(); items.forEach(it=>{ const k=norm(it.d.day)+"|"+norm(it.d.date); if(!days.has(k)) days.set(k,[]); days.get(k).push(it.d); });
    const dl=[...days.entries()];
    /* كل الأيام في صفحة واحدة إن اتسعت، وإلا كل يومين في صفحة */
    const pages = items.length<=14 ? [dl] : dl.reduce((acc,x,i)=>{ if(i%2===0) acc.push([]); acc[acc.length-1].push(x); return acc; },[]);
    return pages.map(pg=>{ const total=pg.reduce((a,[,v])=>a+v.length,0); const h=Math.max(11,Math.min(22,138/total));
      const auditors=uniq(pg.flatMap(([,v])=>v.map(d=>shortName(d.aud))));
      return `<div class="sheet land">${head()}<div class="p-title">التصحيح والمراجعة والتدقيق</div>
      <table class="pt"><colgroup><col style="width:8%"><col style="width:10%"><col style="width:13%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:9%"></colgroup>
      <thead><tr><th>اليوم</th><th>التاريخ</th><th>الصف</th><th>المادة</th><th>المصحح ١</th><th>المصحح ٢</th><th>المراجع ١</th><th>المراجع ٢</th><th>التدقيق</th></tr></thead>
      <tbody>${pg.map(([k,v],di)=>{ const [day,date]=k.split("|"); return v.map((d,i)=>`<tr style="height:${h}mm">${i===0?`<td rowspan="${v.length}" style="font-weight:700;font-size:calc(13px*var(--fz))">${esc(day)}</td><td rowspan="${v.length}" style="font-weight:700">${ar(date)}</td>`:""}<td style="white-space:nowrap;font-size:calc(10.5px*var(--fz))">${esc(d.grade)}</td><td style="font-weight:700">${esc(d.subject)}</td><td class="sig">${esc(shortName(d.c1))}</td><td class="sig">${esc(shortName(d.c2))}</td><td class="sig">${esc(shortName(d.r1))}</td><td class="sig">${esc(shortName(d.r2))}</td>${(di===0&&i===0)?`<td rowspan="${total}" class="top"><div class="vt" style="font-size:calc(14px*var(--fz))">${esc(auditors.join("\n"))}</div></td>`:""}</tr>`).join(""); }).join("")}</tbody></table>
      ${foot(`مراقب اللجان: <span class="who">${esc(S.general.deputy)}</span>`)}</div>`; }).join(""); },

  observers(o){ const ses=selectedSessions(o).filter(s=>s.rows.some(r=>norm(r.com))); if(!ses.length) return "";
    return ses.map(s=>{ const cm=new Map(); s.rows.filter(r=>norm(r.com)).forEach(r=>{ const k=norm(r.com); if(!cm.has(k)) cm.set(k,{com:k,loc:r.loc,obs:[]}); const e=cm.get(k); if(!e.loc) e.loc=r.loc; [r.o1,r.o2].map(norm).filter(Boolean).forEach(n=>{ if(!e.obs.includes(n)) e.obs.push(n); }); });
      const list=[...cm.values()].sort((a,b)=>cmpOrd(a.com,b.com)); const res=uniq(s.rows.flatMap(r=>[r.s1,r.s2]));

      return `<div class="sheet land">${head()}

        <table class="pt" style="margin-top:4mm"><colgroup><col style="width:14%"><col style="width:58%"><col style="width:28%"></colgroup><thead><tr><th>الاحتياط</th><th>الاسم</th><th>التوقيع</th></tr></thead>
        <tbody>${(res.length?res:["",""]).map((n,i,a)=>`<tr style="height:7mm">${i===0?`<td rowspan="${a.length}" style="font-weight:700">الاحتياط</td>`:""}<td style="font-weight:700">${esc(n)}</td><td></td></tr>`).join("")}</tbody></table>

  handover(o){ const ses=selectedSessions(o).filter(s=>s.rows.some(r=>norm(r.com)||norm(r.subject))); if(!ses.length) return "";
    const V=t=>`<div class="vt">${t}</div>`;
    /* أسماء بالطول، كل اسم في سطر واحد، متباعدة، تبدأ من أعلى الخلية ويبقى الفراغ تحتها للتوقيع */
    /* السطر الأول: الأسماء متتالية بالطول ومتباعدة. السطر الثاني بجانبها فارغ للتوقيع تحت كل اسم */
    const VN=(arr,w,Hmm)=>{ if(!arr.length) return ""; const k=arr.length; const gap=7*3.78; const Hpx=Hmm*3.78-12;
      const L=arr.reduce((a,n)=>a+n.length,0); const fs=Math.max(8,Math.min(13.5,(Hpx-(k-1)*gap)/(L*0.56)));
      return `<div class="vrow"><div class="vcol" style="gap:${gap.toFixed(0)}px">${arr.map(n=>`<span class="vt1" style="font-size:calc(${fs.toFixed(1)}px*var(--fz))">${esc(n)}</span>`).join("")}</div></div>`; };
    return ses.map(s=>{ const cm=new Map(); s.rows.filter(r=>norm(r.com)).forEach(r=>{ const k=norm(r.com); if(!cm.has(k)) cm.set(k,{com:k,obs:[]}); [r.o1,r.o2].map(norm).filter(Boolean).forEach(n=>{ if(!cm.get(k).obs.includes(n)) cm.get(k).obs.push(n); }); });
      const coms=[...cm.values()].sort((a,b)=>cmpOrd(a.com,b.com)); const list=coms.length?coms:[{com:"",obs:[]}]; const n=list.length;
      const ex=[]; const seen=new Set(); s.rows.filter(r=>norm(r.subject)).sort((a,b)=>rankGrade(a.grade)-rankGrade(b.grade)).forEach(r=>{ const k=norm(r.grade)+"|"+norm(r.subject); if(!seen.has(k)){seen.add(k);ex.push(r);} });
      const names=ks=>uniq(s.rows.flatMap(r=>ks.map(k=>shortName(r[k]))));

      const h=Math.max(14,Math.max(48,Math.min(128,n*22))/n);
      return `<div class="sheet land">${head()}
        <table class="flow"><colgroup><col style="width:5.5%"><col style="width:5%"><col style="width:5%"><col style="width:5.5%"><col style="width:9%"><col style="width:4.5%"><col style="width:7%"><col style="width:7.5%"><col style="width:7.5%"><col style="width:7%"><col style="width:6.5%"><col style="width:6.5%"><col style="width:7%"><col style="width:7.5%"><col style="width:9%"></colgroup>
        <thead><tr class="grp"><th colspan="3"><div class="per">سير ورقة الإجابة</div></th><th colspan="3"><div class="per">الفترة : ( ${esc(s.period)} )</div></th><th colspan="3"><div>لجنة التصحيح والمراجعة</div></th><th colspan="3"><div>لجنة الرصد وإخراج النتائج</div></th><th colspan="2"><div>لجنة التصحيح والمراجعة</div></th><th><div class="sm">لجنة التحكم والضبط</div></th></tr>
        <tr class="hd"><th>اليوم والتاريخ</th><th>المواد</th><th>الصفوف</th><th>اللجان</th><th>ملاحظ اللجنة</th><th>عدد الأوراق</th><th>الاستلام من لجنة التحكم والضبط</th><th>تصحيح</th><th>تدقيق</th><th>الاستلام من لجنة التحكم والضبط</th><th>رصد في نور</th><th>طباعة الكشف</th><th>الاستلام من لجنة التصحيح والمراجعة</th><th>مطابقة الكشف مع أوراق الإجابة</th><th>الاستلام النهائي والحفظ</th></tr></thead>
        <tbody>${list.map((c,i)=>`<tr style="height:${h}mm">${i===0?`<td rowspan="${n}" class="shade">${V(`${esc(s.day)}  -  الموافق : ${ar(s.date)}`)}</td><td rowspan="${n}" class="shade">${V(esc(ex.map(r=>r.subject).join("  -  ")))}</td><td rowspan="${n}" class="shade">${V(esc(uniq(ex.map(r=>r.grade)).join("  -  ")))}</td>`:""}
          <td class="shade b">${esc(c.com)}</td><td class="shade obs">${c.obs.map(x=>`<div>${esc(shortName(x))}</div>`).join("")}</td><td class="shade b">${c.com?ar(studentsOf(c.com).length):""}</td>
          ${i===0?[ctrl,corr,rev,mon,[],[],mon,rev,fin].map(t=>`<td rowspan="${n}" class="vleft">${VN(t,0,h*n)}</td>`).join(""):""}</tr>`).join("")}</tbody></table>
        ${foot(`مراقب اللجان : <span class="who">${esc(S.general.deputy)}</span>`)}</div>`; }).join(""); },

  envelope(o){ const out=[]; selectedSessions(o).forEach(s=>{ const seen=new Set(), ex=[]; s.rows.filter(r=>norm(r.subject)).sort((a,b)=>rankGrade(a.grade)-rankGrade(b.grade)).forEach(r=>{ const k=norm(r.grade)+"|"+norm(r.subject); if(!seen.has(k)){ seen.add(k); ex.push(r); } }); if(ex.length) out.push({s,ex}); });
    if(!out.length) return ""; const g=S.general;
    return out.map(({s,ex})=>{ const ctrl=uniq(s.rows.map(x=>x.ctrl))[0]||"";
      const members=[[g.deputy,"وكيل المدرسة","رئيسًا"],[ctrl,"عضو لجنة التحكم والضبط","عضوًا"],["","معلم","عضوًا"],["","معلم","عضوًا"]];
      const rh=Math.max(9,Math.min(14,70/ex.length));
      return `<div class="sheet">${head()}

      <table class="pt big"><colgroup><col style="width:30%"><col style="width:40%"><col style="width:30%"></colgroup>
        <thead><tr><th>اليوم</th><th>التاريخ</th><th>الفترة</th></tr></thead>
        <tbody><tr><td><b>${esc(s.day)}</b></td><td><b>${ar(s.date)}</b></td><td><b>${esc(s.period)}</b></td></tr></tbody></table>
      <table class="pt big" style="margin-top:4mm"><colgroup><col style="width:7%"><col style="width:25%"><col style="width:32%"><col style="width:13%"><col style="width:23%"></colgroup>
        <thead><tr><th>م</th><th>المادة</th><th>الصف / المستوى</th><th>ساعة الفتح</th><th>حالة المظروف</th></tr></thead>
        <tbody>${ex.map((r,i)=>`<tr style="height:${rh}mm"><td>${ar(i+1)}</td><td><b>${esc(r.subject)}</b></td><td style="white-space:nowrap;font-size:calc(14px*var(--fz))">${esc(r.grade)}</td><td></td><td style="white-space:nowrap">☐ سليم &nbsp; ☐ غير سليم</td></tr>`).join("")}
        <tr><td colspan="5" class="stmt">تم فتح مظاريف الأسئلة الموضحة أعلاه في الساعة المدونة أمام كل مادة، وتم التحقق من حالتها وتحرير محضر بذلك.</td></tr></tbody></table>
      <table class="pt big" style="margin-top:4mm"><colgroup><col style="width:8%"><col style="width:34%"><col style="width:24%"><col style="width:14%"><col style="width:20%"></colgroup>
        <thead><tr><th colspan="5">أعضاء اللجنة</th></tr><tr><th>م</th><th>الاسم</th><th>عمله</th><th>الصفة</th><th>التوقيع</th></tr></thead>
        <tbody>${members.map((m,i)=>`<tr style="height:12mm"><td>${ar(i+1)}</td><td class="name">${esc(m[0])}</td><td>${m[1]}</td><td>${m[2]}</td><td></td></tr>`).join("")}</tbody></table>
      <div class="notes-lines"><b>ملاحظات:</b><div></div><div></div></div>
      ${foot()}</div>`; }).join(""); },

  violation(o){ const g=S.general; const st=o.stu!==undefined&&o.stu!==""?S.students[+o.stu]:null; const ex=o.ex!==undefined&&o.ex!==""?examList()[+o.ex]:null;
    const obs = (st&&ex)? (ex.s.rows.find(r=>norm(r.com)===norm(st.committee))||{}) : {};
    const box=(label,val,cls)=>`<fieldset class="vf ${cls||""}"><legend>${label}</legend><div>${val||"&nbsp;"}</div></fieldset>`;
    /* يظهر المختار فقط بعلامة ✓، وإذا لم يُختر شيء تظهر الخيارات فارغة للتعبئة باليد */
    const opts=(arr,sel)=>{ const chosen=arr.filter(t=>(sel||[]).includes(t)); return `<div class="vopts">${chosen.length? chosen.map(t=>`<span class="on">✓ ${t}</span>`).join("") : arr.map(t=>`<span>☐ ${t}</span>`).join("")}</div>`; };
    return `<div class="sheet viol">${head()}<div class="p-title">محضر مخالفة أنظمة الاختبارات</div>
      <div class="vgrid g3">${box("اسم الطالب",st?esc(st.name):"","wide")}${box("الصف",st?ar(st.grade):"")}${box("رقم الجلوس",st?ar(st.seat):"")}</div>
      <div class="vgrid g4">${box("المادة",ex?esc(ex.r.subject):"")}${box("رقم اللجنة",st?esc(st.committee):"")}${box("الفترة",ex?esc(ex.s.period):"")}${box("تاريخ الاختبار",ex?ar(ex.s.date):"")}</div>
      <div class="vgrid g2">${box("تكرار المخالفة",opts(VIOL.repeat,[o.repeat]))}${box("صفة المخالفة",opts(VIOL.nature,[o.nature]))}</div>
      <div class="vgrid g2">${box("نوع المخالفة",opts(VIOL.types,o.types))}${box("الإجراء المتخذ",opts(VIOL.acts,o.acts))}</div>
      ${box("وصف المخالفة كما تم ضبطها",o.desc?esc(o.desc).replace(/\n/g,"<br>"):"<span class='blank'></span>","tall")}
      ${box("التوصية والإحالة",o.rec?esc(o.rec).replace(/\n/g,"<br>"):"<span class='blank'></span>","mid")}
      <div class="vsign"><div><span>الملاحظ</span>${esc(obs.o1||"")||"..........................."}<i>التوقيع: ................</i></div><div><span>المشرف على اللجنة</span>${esc(g.deputy)||"..........................."}<i>التوقيع: ................</i></div><div><span>مدير المدرسة</span>${esc(g.principal)||"..........................."}<i>التوقيع: ................</i></div></div>
      </div>`; },
};
const VIOL={repeat:["المرة الأولى","المرة الثانية","المرة الثالثة"],nature:["فردية","جماعية"],
  types:["محاولة الغش","حيازة ورقة أو جهاز ممنوع","التحدث أو الإخلال بالنظام","الخروج دون إذن","مخالفة تعليمات الملاحظة"],
  acts:["تنبيه شفهي وإكمال الاختبار","سحب الورقة الممنوعة","نقل الطالب إلى مقعد آخر","إيقاف الاختبار ورفع المحضر"]};
function examList(){ const out=[]; sessions().forEach(s=>{ const seen=new Set(); s.rows.filter(r=>norm(r.subject)).forEach(r=>{ const k=norm(r.grade)+"|"+norm(r.subject); if(!seen.has(k)){seen.add(k);out.push({s,r});} }); }); return out; }
function violPanel(o){ o.types=o.types||[]; o.acts=o.acts||[];
  const stu=S.students.map((x,i)=>({x,i})).sort((a,b)=>cmpOrd(a.x.committee,b.x.committee)||String(a.x.name).localeCompare(String(b.x.name),"ar"));
  const chk=(name,arr,sel,type)=>arr.map((t,i)=>`<label class="vchk"><input type="${type}" name="${name}" value="${esc(t)}" ${(type==="radio"?sel===t:(sel||[]).includes(t))?"checked":""}> ${t}</label>`).join("");
  return `<div class="panel no-print viol-form">
    <div class="form-grid">
      <div class="fld"><label for="v-stu">الطالب</label><select id="v-stu"><option value="">— نموذج فارغ —</option>${stu.map(({x,i})=>`<option value="${i}" ${String(o.stu)===String(i)?"selected":""}>${esc(x.name)} — لجنة ${esc(x.committee)}</option>`).join("")}</select></div>
      <div class="fld"><label for="v-ex">الاختبار</label><select id="v-ex"><option value="">—</option>${examList().map((e,i)=>`<option value="${i}" ${String(o.ex)===String(i)?"selected":""}>${esc(e.r.subject)} — ${esc(e.r.grade)} — ${esc(e.s.day)} ${esc(e.s.date)} (${esc(e.s.period)})</option>`).join("")}</select></div>
      <div class="fld"><label>صفة المخالفة وتكرارها</label><div class="vchks">${chk("v-nature",VIOL.nature,o.nature,"radio")}<span class="sep"></span>${chk("v-repeat",VIOL.repeat,o.repeat,"radio")}</div></div>
    </div>
    <div class="form-grid" style="margin-top:12px">
      <div class="fld"><label>نوع المخالفة</label><div class="vchks">${chk("v-types",VIOL.types,o.types,"checkbox")}</div></div>
      <div class="fld"><label>الإجراء المتخذ</label><div class="vchks">${chk("v-acts",VIOL.acts,o.acts,"checkbox")}</div></div>
      <div class="fld"><label for="v-desc">وصف المخالفة كما تم ضبطها</label><textarea id="v-desc" style="min-height:90px">${esc(o.desc||"")}</textarea></div>
    </div>
    <div class="fld" style="margin-top:12px"><label for="v-rec">التوصية والإحالة</label><textarea id="v-rec" style="min-height:70px">${esc(o.rec||"")}</textarea></div>
  </div>`; }
function bindViol(o,draw){
  $("#v-stu").onchange=e=>{o.stu=e.target.value;draw();};
  $("#v-ex").onchange=e=>{o.ex=e.target.value;draw();};
  document.querySelectorAll('input[name="v-nature"]').forEach(x=>x.onchange=()=>{o.nature=x.value;draw();});
  document.querySelectorAll('input[name="v-repeat"]').forEach(x=>x.onchange=()=>{o.repeat=x.value;draw();});
  const multi=(name,key)=>document.querySelectorAll(`input[name="${name}"]`).forEach(x=>x.onchange=()=>{o[key]=[...document.querySelectorAll(`input[name="${name}"]:checked`)].map(c=>c.value);draw();});
  multi("v-types","types"); multi("v-acts","acts");
  $("#v-desc").oninput=e=>{o.desc=e.target.value;draw();};
  $("#v-rec").oninput=e=>{o.rec=e.target.value;draw();};
}
/* اختصار الاسم إلى الاسم الأول والثاني (مع ضم «عبد» و«أبو» لما بعدها) */
function shortName(n){ const w=norm(n).split(" ").filter(Boolean); const t=[]; for(let i=0;i<w.length;i++){ if(/^(عبد|ابو|أبو)$/.test(w[i])&&w[i+1]){ t.push(w[i]+" "+w[i+1]); i++; } else t.push(w[i]); } return t.slice(0,2).join(" "); }
function rankGrade(g){ const s=norm(g); const m=["الأول","الثاني","الثالث"].findIndex(x=>s.startsWith(x)); if(m>=0) return m; const n=parseInt(latin(s)); return isNaN(n)?50:n; }

/* ======================= بيانات تجريبية ======================= */

  S=blank();
  Object.assign(S.general,{year:"1447 - 1448 هـ",term:"الثاني",school:"ثانوية النموذجية (مثال)",principal:"اسم مدير المدرسة",deputy:"اسم وكيل المدرسة",counselor:"اسم الموجه الطلابي"});

  S.control=["تركي ناصر","وليد حمد"];

  const comsL=["الأولى","الثانية","الثالثة"], locs={"الأولى":"1ث1","الثانية":"2ث1","الثالثة":"3ث1"};
  let seat=1;
  comsL.forEach((c,ci)=>{ for(let i=0;i<12;i++){ S.students.push({id:String(1150000000+ci*1000+i*37),name:`${first[(i+ci*5)%12]} ${first[(i*7+3)%12]} ${last[(i+ci)%6]}`,seat:String(seat++),grade:`${ci+1}ث - 1`,section:ci===0?"السنة المشتركة":"المسار العام",committee:c}); } });
  const days=[["الأحد","28-12-1447هـ",[["الأول الثانوي (السنة المشتركة)","الرياضيات"],["الثاني الثانوي","الرياضيات"],["الثالث الثانوي","الرياضيات"]]],
              ["الاثنين","29-12-1447هـ",[["الأول الثانوي (السنة المشتركة)","الفيزياء"],["الثاني الثانوي","الكيمياء"],["الثالث الثانوي","الفيزياء"]]],
              ["الثلاثاء","1-1-1448هـ",[["الأول الثانوي (السنة المشتركة)","اللغة الإنجليزية"],["الثاني الثانوي","اللغة الإنجليزية"],["الثالث الثانوي","اللغة الإنجليزية"]]]];
  const T=S.teachers; let k=0;
  days.forEach(([day,date,ex],di)=>{ comsL.forEach((c,ci)=>{ const [grade,subject]=ex[ci];
    S.dist.push({day,date,period:"الأولى",from:"7:00 ص",to:"9:30 ص",grade,subject,c1:T[(di+ci)%10],r1:T[(di+ci+3)%10],c2:T[(di+ci+1)%10],r2:T[(di+ci+4)%10],aud:"عمر فيصل",
      com:c,loc:locs[c],o1:T[(k++)%10],o2:T[(k++)%10],s1:T[(di+7)%10],s2:"",ctrl:"تركي ناصر",mon:"سامي عبدالعزيز",aud2:"وليد حمد"}); }); });
}
